client: FALABELLA_RETAIL
jurisdiction: CL
insurance:
  mode: policy_rate
  # Inferred from PRORRATEO MASTER and pending confirmation with the agency.
  coverage_pct: 1.15
  coverage_pct_provenance: inferred
  policy_rate: 0.000462
  effective_from: 2026-01-01
  note: "Annual policy; fixed rate for every shipment and renewed yearly."
allocation:
  basis: invoice_value
default_incoterm: FOB
transport_document: direct_bl
extraction:
  classification_min_confidence: 0.90
  financial_min_confidence: 0.95
  templates:
    - id: falabella-dispatch-instruction-v1
      document_types: [dispatch_instruction]
      match_any: ["FALABELLA RETAIL S.A. INSTRUCCIÓN DE DESPACHO"]
    - id: oceanlink-bill-of-lading-v1
      document_types: [bill_of_lading]
      match_any: ["OCEANLINK SHIPPING CO., LTD. BILL OF LADING"]
    - id: configured-asian-supplier-commercial-v1
      document_types: [commercial_invoice, packing_list, certificate_of_origin]
      match_any:
        - "NINGBO HOMEWARE MANUFACTURING CO., LTD."
        - "SHENZHEN BRIGHTPATH ELECTRONICS"
        - "NINGBO CIF SUPPLIER"
    - id: cordillera-cargo-policy-v1
      document_types: [insurance_certificate]
      match_any: ["Compañía de Seguros Generales Cordillera S.A."]
  review_fields:
    dispatch_instruction: [freight_amount, freight_currency]
    bill_of_lading: [freight_amount, freight_currency, declared_value_total]
    commercial_invoice:
      [incoterm, currency, invoice_total, lines.*.hs_code, lines.*.quantity, lines.*.unit_price, lines.*.line_total]
    packing_list:
      [gross_weight_kg, net_weight_kg, lines.*.gross_weight_kg, lines.*.net_weight_kg]
    insurance_certificate: [sum_insured, premium, premium_rate, currency]
    certificate_of_origin: [items.*.hs_code]
