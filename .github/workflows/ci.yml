name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check app tests scripts migrations
      - run: ruff check app tests scripts migrations
      - run: python -m pytest -q
      - run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  docker-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Start isolated application stack
        run: docker compose -p aduana-ci -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: Run browser E2E
        run: npm run test:e2e
        working-directory: web
      - name: Print container logs on failure
        if: failure()
        run: docker compose -p aduana-ci -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail 250
      - name: Remove isolated application stack
        if: always()
        run: docker compose -p aduana-ci -f docker-compose.yml -f docker-compose.e2e.yml down -v
