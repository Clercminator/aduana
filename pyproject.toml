[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aduanera-automation-demo"
version = "0.1.0"
description = "Demo de automatización de despachos aduaneros de Chile"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdfium2>=4.30,<5",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["llm: live OpenRouter extraction evaluation"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
